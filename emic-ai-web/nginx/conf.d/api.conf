# Default server configuration
#
server {
	listen 10251 default_server;
	listen [::]:10251 default_server;
	server_name emirobotapi.emic.com.cn; # 项目域名
	# See: https://bugs.debian.org/773332
	#
	# Read up on ssl_ciphers to ensure a secure configuration.
	# See: https://bugs.debian.org/765782
	#
	# Self signed certs generated by the ssl-cert package
	# Don't use them in a production server!
	#
	# include snippets/snakeoil.conf;

	root /var/pbx/website/public;

	# Add index.php to the list if you are using PHP
	index index.php index.html index.htm index.nginx-debian.html;
	error_page 404 /404.html;

	location / {
		# vue router
       		if ($uri ~* '^/(develop)') {
         		rewrite  ^(.*)$  /themes/develop/index.html?$1  last;
           		break;
       		}

		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/  /index.html;
		client_body_buffer_size 128k;
       		if (!-e $request_filename) {
           		rewrite  ^(.*)$  /index.php?s=$1  last;
       		}
    	}

	# pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
	#
	location ~ \.php$ {
		fastcgi_pass   127.0.0.1:9000;        
		fastcgi_intercept_errors on;
        	fastcgi_index  index.php;        
    		fastcgi_param  SCRIPT_FILENAME  	$document_root$fastcgi_script_name;        
    		fastcgi_param  PHP_VALUE        	open_basedir=$document_root/../:/var/pbx/tmp/:/var/pbx/upload/:/tmp/:/proc/;
        	include        fastcgi_params;
	}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#	deny all;
	#}
}

# HTTPS 	
server {
	# Note: You should disable gzip for SSL traffic.
	# SSL configuration
	listen 443 ssl;
	server_name emirobotapi.emic.com.cn; # 项目域名
 
	ssl on;
	ssl_certificate /etc/nginx/crt/_.emicloud.com_bundle.crt; #(证书公钥)
	ssl_certificate_key /etc/nginx/crt/emicloud.com_RSA.key; #(证书私钥)
 
	ssl_session_timeout 5m;
	ssl_protocols  SSLv2 SSLv3 TLSv1 TLSv1.1 TLSv1.2;
	ssl_ciphers  ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
	ssl_prefer_server_ciphers on;
 
	location / {
		proxy_pass      http://127.0.0.1:10251; # 服务器地址
		proxy_set_header   Host             $host;
		proxy_set_header   X-Real-IP        $remote_addr;
		proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
		proxy_connect_timeout 300s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}
 
}

